# Publishes site/ (the privacy policy Google Play and Health Connect require, plus a small landing
# page) to GitHub Pages at https://eniloan4002.github.io/LogEZ/ -- the policy lives at /privacy/.
#
# One-time setup by the repo owner: Settings > Pages > Build and deployment > Source: GitHub Actions.
# site/privacy/index.html is generated from the app's PrivacyPolicyContent; a unit test fails when
# the two drift, so this workflow only ever publishes the text the app itself shows.
name: Publish site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
