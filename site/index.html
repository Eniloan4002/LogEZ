<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogEZ</title>
<style>
:root { color-scheme: light dark; --bg: #ffffff; --fg: #15191c; --muted: #5b6770; --accent: #3d6b00; }
@media (prefers-color-scheme: dark) { :root { --bg: #0a0d0f; --fg: #eef2ef; --muted: #9aa7a0; --accent: #b6ff3c; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 2em; margin: 0 0 8px; }
p { margin: 12px 0; }
.muted { color: var(--muted); }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>LogEZ</h1>
<p>A workout log for Android: routines, sets, personal records, GPS walks and runs, body measurements and statistics.</p>
<p>There is no account and no server. Everything you log stays on your phone.</p>
<p><a href="privacy/">Privacy policy</a></p>
<p class="muted">Support and questions: see the contact address in the privacy policy.</p>
</main>
</body>
</html>
